# Local PostgreSQL with pgvector:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stusupport
      POSTGRES_PASSWORD: stusupport
      POSTGRES_DB: stusupport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
